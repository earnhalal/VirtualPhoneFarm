# Real Virtual Phones — har service = 1 asal Android phone (redroid)
# Har phone ka: apna container, apna static IP, apni alag /data volume
# (uski storage, apps, Android ID restart ke baad bhi wahi rehte hain).
#
# Host requirements: Linux ya Windows (Docker Desktop + WSL2), KVM support,
# ~2GB RAM per phone. Chalana:  docker compose up -d
# Zyada phones: neeche wale block ko copy karke VM-006, IP .16, port 5560 kar dein.

services:
  phone-1:
    image: redroid/redroid:13.0.0-latest
    container_name: vm-001
    hostname: vm-001
    privileged: true
    restart: unless-stopped
    volumes:
      - vm001-data:/data
    ports:
      - "5555:5555"   # is phone ka ADB bahar se
    networks:
      farm:
        ipv4_address: 172.28.0.11
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=15

  phone-2:
    image: redroid/redroid:13.0.0-latest
    container_name: vm-002
    hostname: vm-002
    privileged: true
    restart: unless-stopped
    volumes:
      - vm002-data:/data
    ports:
      - "5556:5555"
    networks:
      farm:
        ipv4_address: 172.28.0.12
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=15

  phone-3:
    image: redroid/redroid:13.0.0-latest
    container_name: vm-003
    hostname: vm-003
    privileged: true
    restart: unless-stopped
    volumes:
      - vm003-data:/data
    ports:
      - "5557:5555"
    networks:
      farm:
        ipv4_address: 172.28.0.13
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=15

  phone-4:
    image: redroid/redroid:13.0.0-latest
    container_name: vm-004
    hostname: vm-004
    privileged: true
    restart: unless-stopped
    volumes:
      - vm004-data:/data
