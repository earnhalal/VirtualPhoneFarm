      - "5558:5555"
    networks:
      farm:
        ipv4_address: 172.28.0.14
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=15

  phone-5:
    image: redroid/redroid:13.0.0-latest
    container_name: vm-005
    hostname: vm-005
    privileged: true
    restart: unless-stopped
    volumes:
      - vm005-data:/data
    ports:
      - "5559:5555"
    networks:
      farm:
        ipv4_address: 172.28.0.15
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=15

networks:
  farm:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  vm001-data:
  vm002-data:
  vm003-data:
  vm004-data:
  vm005-data:
